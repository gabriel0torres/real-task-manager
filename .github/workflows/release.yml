# Publishes a GitHub Release with the installers, the Python wheel and the
# standalone executables when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          ruff check rts tests
          pytest -q -p no:warnings
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc -b
          npm test

  web:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: frontend/dist

  linux:
    needs: web
    runs-on: ubuntu-22.04
    # Old glibc (2.31): the executable runs on Ubuntu 20.04+, Debian 11+, RHEL 9+...
    container: python:3.12-slim-bullseye
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends binutils
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: backend/rts/web
      - run: pip install -e "backend[postgres]" pyinstaller
      - run: python scripts/build_release.py --skip-web --exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/*

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: backend/rts/web
      - run: pip install -e "backend[postgres]" pyinstaller
      - run: python scripts/build_release.py --skip-web --exe --no-wheel
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*.zip

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Real Task Scheduler ${GITHUB_REF_NAME}" \
            --notes "Instalação sem Docker: veja a seção 'Instalação sem Docker' do README."
